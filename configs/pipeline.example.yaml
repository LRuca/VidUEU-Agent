# Copy to pipeline.local.yaml in the repository root before editing.
version: 1
preset: paper
input: ./videos
output: ./outputs/run-001
model_root: ./model
capabilities: [understanding, editing, unified]
tools: [ocr, asr, yolo, omniparser]
hardware:
  profile: external_vlm_cpu_tools
  gpus: []
llm:
  base_url: https://api.deepseek.com
  model: deepseek-flash
  api_key_env: DEEPSEEK_API_KEY
vlm:
  # An existing OpenAI-compatible vision endpoint, local or remote.
  base_url: http://127.0.0.1:8110/v1
  model: Qwen3.5-9B-local
budget:
  max_api_attempts: 100
network:
  proxy_mode: direct
