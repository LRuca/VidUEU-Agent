name: Offline release checks
on: [push, pull_request]
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y tmux ffmpeg
      - run: python -m pip install -r requirements/dev.txt
      - run: python -m pip install --no-deps -e .
      - run: CUDA_VISIBLE_DEVICES='' python -m pytest -q tests/test_release_tools.py tests/test_public_cli.py tests/test_doctor_endpoint.py tests/test_deploy.py tests/test_download_tls.py
      - run: python scripts/check_release.py
      - run: bash -n deploy.sh setup.sh scripts/run_pipeline.sh scripts/start_vllm.sh scripts/run_iteration.sh
      - run: python -m build --wheel
